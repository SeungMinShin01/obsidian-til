# 구역 규칙 — 기계·사람 공용 원본 (Single Source of Truth)
# 검사기·Sync·RAG는 이 파일을 읽는다. 수정은 마스터 세션만.
# 링크 유형: 뼈대(트리/사슬) / 가로(그물) / 관문(개념 노드 경유)

zones:
  Java:
    prefix: "Java "
    링크: { 뼈대: "MOC → day 사슬(이전/다음)", 가로: 금지, 관문: 허용 }
    개념승격: true
    공개: true
    notion: true
    담당: KDT 학습
  Spring:
    prefix: "Spring "
    링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }
    개념승격: true
    공개: true
    notion: true
    담당: KDT 학습
  JavaScript: { prefix: "JS ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  CSS:       { prefix: "CSS ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  HTML:      { prefix: "HTML ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  CS 이론:   { prefix: "SQL |CS ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  Python:    { prefix: null, 링크: { 뼈대: "인덱스 → 노트", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  RPA:       { prefix: null, 링크: { 뼈대: "인덱스 → 노트", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  AI:        { prefix: null, 링크: { 뼈대: "인덱스 → 노트", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }

  개념:
    prefix: "개념 - "     # Repository Pattern 등 기존 예외 허용
    설명: "전역 개념 층 — 여러 구역에 걸친 개념의 관문. 구역 고립의 유일한 전역 예외"
    링크: { 뼈대: "개념 MOC → 개념 노드", 가로: 금지(개념끼리), 등장위치: "여러 구역으로 허용" }
    승격조건: "기계: 서로 다른 구역 2곳 이상 등장(검사기가 후보 탐지) + 사람 승인(구역 비종속·의미 동일·실제 도움)"
    공개: true
    notion: true
    담당: 마스터(승인)·발견 세션(제안)

  코드정리:
    prefix: "JAVA |JS |CSS |HTML |성능 |CS "   # 브랜치 접두사
    링크: { 뼈대: "루트 → 언어 → 주제 → 세부(한 칸)", 가로: 금지, 예외: "코드실습→코드정리 단방향 수신" }
    쓰기판정: "새 노트 전 검색 의무 — 있으면 잔차로 덧붙임"
    성격: 사실노트(중복 제거 대상)
    공개: true
    notion: true
    담당: 코드훈련
  코드실습:
    prefix: "코드실습 - "
    링크: { 뼈대: "안내 → 실습 노트", 가로: 금지, 예외: "코드정리로 단방향 발신" }
    성격: 학습기록(중복 허용)
    공개: true
    notion: true
    담당: 코드훈련

  프로젝트 코드 분석:
    prefix: "보드게임 - "   # 프로젝트별 접두사
    링크: { 뼈대: "프로젝트 MOC → 분석 노트", 가로: "폴더 내 자유", 바깥: "MOC↔학습지도 매핑표만" }
    성격: 학습기록(중복 허용)
    공개: true
    notion: true
    담당: 보드게임카페 분석
  프로젝트 노트:
    prefix: "수집기 |WMS "
    하위폴더_prefix: { 변경이력: "변경이력 - ", 트러블슈팅: "트러블슈팅 - ", 수집기 코드분석: "코드분석 - ", WMS 정리내용: "WMS 정리 - " }  # 2026-09-04 승인 — 폴더별 인덱스+접두사 구조
    유형태그: 프로젝트   # 허브·규칙·개념 노트는 각자 유형
    링크: { 뼈대: "번호 트리/리스트 + 앞뒤 사슬", 가로: 금지, 관문: 허용, 예외: "장부→CLAUDE 1개" }
    성격: 프로젝트기록(중복 허용, 소급 정리 제외 구역)
    공개: true
    notion: true
    담당: 수집기·WMS·WMS 정리
  기술정리:
    prefix: "주제별 (Java - , Spring - )"
    링크: { 뼈대: "인덱스 → 잔차 트리(Root/Δ)", 가로: 금지(Δ끼리), 관문: 허용 }
    성격: 사실노트(잔차 판정)
    공개: true
    notion: true
    담당: 기술정리
  개인정리:
    prefix: null           # 선택
    설명: "면접 대비 — 사용자 초안을 AI가 포맷·내용 다듬기(의미 보존)"
    링크: { 뼈대: "인덱스 → 노트", 가로: "폴더 내 자유" }
    공개: true
    notion: true
    담당: 미지정(추후)
  Fast-EQA:
    설명: "비공개 고립 구역 — 이 파일의 규칙 대상 아님. 자체 규칙(스킬) 따름"
    공개: false
    notion: false
    담당: Fast-EQA 학습

전역:
  탭색채널: [지도·MOC(시간), 개념 노드(주제), 태그(분류), 전문 검색(키워드)]
  정규소속: "모든 노트의 트리 부모는 1개 (탐색 경로는 여러 채널 허용)"
  태그: "_규칙/태그 사전.md 등록 어휘만 — 미등록은 Warning(추후 Error)"
  개념링크: "개념끼리 자유 연결 금지 — 현재는 전면 금지, 필요 반복 확인 시 관계 타입(상위/구성/대조/선행) 도입 검토"
