# 구역 규칙 — 기계·사람 공용 원본 (Single Source of Truth)
# 검사기·Sync·RAG는 이 파일을 읽는다. 수정은 마스터 세션만.
# 링크 유형: 뼈대(트리/사슬) / 가로(그물) / 관문(개념 노드 경유)

zones:
  Java:
    prefix: "Java "
    링크: { 뼈대: "MOC → day 사슬(이전/다음)", 가로: 금지, 관문: 허용 }
    개념승격: true
    공개: true
    notion: true
    담당: KDT 학습
  Spring:
    prefix: "Spring "
    링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }
    개념승격: true
    공개: true
    notion: true
    담당: KDT 학습
  JavaScript: { prefix: "JS ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  CSS:       { prefix: "CSS ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  HTML:      { prefix: "HTML ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  CS 이론:   { prefix: "SQL |CS ", 링크: { 뼈대: "MOC → day 사슬", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  Python:    { prefix: null, 링크: { 뼈대: "인덱스 → 노트", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  RPA:       { prefix: null, 링크: { 뼈대: "인덱스 → 노트", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }
  AI:        { prefix: null, 링크: { 뼈대: "인덱스 → 노트", 가로: 금지, 관문: 허용 }, 개념승격: true, 공개: true, notion: true, 담당: KDT 학습 }

  개념:
    prefix: "개념 - "     # Repository Pattern 등 기존 예외 허용
    설명: "전역 개념 층 — 여러 구역에 걸친 개념의 관문. 구역 고립의 유일한 전역 예외"
    링크: { 뼈대: "개념 MOC → 개념 노드", 가로: 금지(개념끼리), 등장위치: "여러 구역으로 허용" }
    승격조건: "기계: 서로 다른 구역 2곳 이상 등장(검사기가 후보 탐지) + 사람 승인(구역 비종속·의미 동일·실제 도움)"
    공개: true
    notion: true
    담당: 마스터(승인)·발견 세션(제안)

  코드정리:
    prefix: "JAVA |JS |CSS |HTML |성능 |CS "   # 브랜치 접두사
    링크: { 뼈대: "루트 → 언어 → 주제 → 세부(한 칸)", 가로: 금지, 예외: "코드실습→코드정리 단방향 수신" }
    쓰기판정: "새 노트 전 검색 의무 — 있으면 잔차로 덧붙임"
    성격: 사실노트(중복 제거 대상)
    공개: true
    notion: true
    담당: 코드훈련
  코드실습:
    prefix: "코드실습 - "
    링크: { 뼈대: "안내 → 실습 노트", 가로: 금지, 예외: "코드정리로 단방향 발신" }
    성격: 학습기록(중복 허용)
    공개: true
    notion: true
    담당: 코드훈련

  프로젝트 코드 분석:
    prefix: "보드게임 - "   # 프로젝트별 접두사
    링크: { 뼈대: "프로젝트 MOC → 분석 노트", 가로: "폴더 내 자유", 바깥: "MOC↔학습지도 매핑표만" }
    성격: 학습기록(중복 허용)
    공개: true
    notion: true
    담당: 보드게임카페 분석
  프로젝트 노트:
    prefix: "수집기 |WMS |RAG 챗봇 "
    하위폴더_prefix: { 변경이력: "변경이력 - ", 트러블슈팅: "트러블슈팅 - ", 수집기 코드분석: "코드분석 - ", WMS 정리내용: "WMS 정리 - " }  # 2026-09-04 승인 — 폴더별 인덱스+접두사 구조
    유형태그: 프로젝트   # 허브·규칙·개념 노트는 각자 유형
    링크: { 뼈대: "번호 트리/리스트 + 앞뒤 사슬", 가로: 금지, 관문: 허용, 예외: "장부→CLAUDE 1개" }
    성격: 프로젝트기록(중복 허용, 소급 정리 제외 구역)
    공개: true
    notion: true
    담당: 수집기·WMS·WMS 정리
  기술정리:
    prefix: "주제별 (Java - , Spring - )"
    링크: { 뼈대: "인덱스 → 잔차 트리(Root/Δ)", 가로: 금지(Δ끼리), 관문: 허용 }
    성격: 사실노트(잔차 판정)
    공개: true
    notion: true
    담당: 기술정리
    스프링_학습:   # 2026-09-09 — Spring 다중 세션 학습. 폴더는 기존 기술정리/Spring/ (명칭 통일 — "스프링" 폴더 신설 금지). 레거시·부트 폴더 분리 없음(대조 방식)
      세션: "학습(개념 대화→정리본 초안→_인박스 투입) · 실습(따라치기·파괴 실험→에러 기록) · 기술정리(인박스→배치·인덱스, 기존 역할)"
      상태폴더: "기술정리/Spring/_상태/ — 세션 간 유일한 통신 수단. 전 세션 시작 시 4파일 읽기, 종료 시 갱신 (전역.상태폴더 규격 적용)"
      상태파일:
        학습 지도.md: "16모듈 진도표 — 표: 번호 | 모듈 | 상태(예정/학습중/인박스/배치됨) | 정리본 링크 | 비고"
        인계.md: "직전 세션 → 다음 세션 3~5줄, 매번 덮어씀 — 날짜·세션 종류·다음 할 일"
        미해결 질문.md: "답 못 낸 질문 누적(- [ ] 체크리스트). 풀리면 줄 삭제 — 답 자체는 정리본에"
        에러 사전.md: "실습 에러 append 전용 — 표: 에러 | 상황 | 원인 | 해결"
      정리본_frontmatter: "출처: 내가 작성(학습 세션) · 작성일 · tags: [학습, spring] — 블로그 원문이 없으므로 원본 키 생략이 정상 (기술정리 세션은 URL을 묻지 않는다)"
      레거시_부트: "태그가 아니라 Spring 정리 인덱스의 '구분' 컬럼(레거시/부트/대조)으로 구분 — 태그 사전 원칙(찾기는 인덱스·파일명·검색 담당)"
      커밋: "학습·실습 세션은 _상태/ + _인박스/ 파일만 커밋 — 메시지 `Spring 학습 - <요지>` / `Spring 실습 - <요지>`. 정리본 본문·인덱스·MOC·머리말 링크는 기술정리 세션만 (`기술정리 - <제목> 추가`)"
    예습자료:   # 2026-09-10 데일리 인풋 규칙제안 01 부분 채택 — 자동 생성물의 지위
      성격: "예습자료 — 무인 세션이 자동 생성, 사용자 미검증. 다른 노트의 근거 금지 · 개념 승격 대상 아님 · 잔차(Root/Δ) 판정 안 함"
      frontmatter: "`성격: 예습자료` 키 필수 (검사기·RAG·Sync의 식별·신뢰도 신호) · tags는 [학습] + 기술 영역 0~2개 — 영역 태그 `뉴스` 신설은 기각(영역은 소문자 영문 기술 도메인만, 형식 구분은 폴더·날짜가 담당)"
      폴더:
        뉴스: "기술정리/뉴스/ — 뉴스 브리핑 심층 분석, 파일명 `뉴스 - YYYY-MM-DD`, 이전/다음 날짜 앞뒤 사슬"
        AI 심층: "기술정리/AI 심층/ — AI 모델·논문 심층 노트, 파일명 `AI - <주제>` (최상위 AI 구역과 혼동 방지 위해 폴더명 변경 채택)"
        Spring 예습: "기술정리/Spring/예습자료/ — 트랙 B 공식 문서 예습, 파일명 `Spring 예습 - BNN <모듈명>`. 결론 금지·질문 3~5개 필수(요약 관문 보호). 학습 지도 트랙 B의 예습 컬럼에 링크"
      링크: "각 인덱스 → 노트 한 칸. 가로·구역 밖 금지. 승격은 기존 흐름(사용자가 읽고 자기 정리 → _인박스 → 기술정리 세션 배치)으로, 정리본 → 예습자료 단방향 출처 링크만"
      notion: false
      담당: "데일리 인풋(무인 예약 세션) — 관할은 위 세 폴더+각 인덱스+학습 지도 예습 컬럼뿐. 인박스 경유 금지"
      결측일: "소스 수집 실패·컴퓨터 꺼진 날은 건너뜀 — 몰아서 생성·빈 노트·추측 노트 금지"
      보류: "폴더 비대화 대응(월별 분할 등)은 3개월 뒤 재검토 (2026-12)"
  개인정리:
    prefix: null           # 선택
    설명: "사용자가 직접 쓰는 개인 공간 (면접 대비 등). 2026-09-10: 규칙·검사 전면 제외 — 세션은 쓰기 금지, 사용자가 요청할 때 포맷 수정만(의미 보존)"
    검사: 제외
    링크: { 뼈대: "자유", 가로: "자유" }
    공개: true
    notion: true
    담당: "없음(사용자 본인) — 세션 쓰기 금지"
  Fast-EQA:
    설명: "비공개 고립 구역 — 이 파일의 규칙 대상 아님. 자체 규칙(스킬) 따름"
    공개: false
    notion: false
    담당: Fast-EQA 학습

전역:
  탭색채널: [지도·MOC(시간), 개념 노드(주제), 태그(분류), 전문 검색(키워드)]
  정규소속: "모든 노트의 트리 부모는 1개 (탐색 경로는 여러 채널 허용)"
  태그: "_규칙/태그 사전.md 등록 어휘만 — 미등록은 Warning(추후 Error)"
  상태폴더: "_상태/ — 구역 하위에 둘 수 있는 세션 간 운영 폴더(진도표·인계·미해결·에러 사전 등). 정리본이 아니므로 _인박스·_템플릿과 동일하게 검사 전 항목 제외, frontmatter 불요(첫 줄 H1 + 한 줄 설명 권장), 노션 동기화 제외. 링크는 구역 안으로만"
  개념링크: "개념끼리 자유 연결 금지 — 현재는 전면 금지, 필요 반복 확인 시 관계 타입(상위/구성/대조/선행) 도입 검토"
